<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planos AGROFSIG</title></head>
<body style="font-family:Arial,sans-serif;padding:24px">
<p id="m">Abriendo plano...</p>
<script>
(async () => {
  const p = decodeURIComponent(location.pathname);
  if (/\.pdf$/i.test(p)) {
    const base = p.replace(/(_\d+| \(\d+\)|\(\d+\))?\.pdf$/i, '');
    const sufijos = [''];
    for (let i = 1; i <= 30; i++) sufijos.push('_' + i, ' (' + i + ')', '(' + i + ')');
    const pruebas = sufijos.map(s => base + s + '.pdf').filter(u => u !== p);
    const r = await Promise.all(pruebas.map(u => fetch(encodeURI(u), { method: 'HEAD' }).then(x => x.ok ? u : null).catch(() => null)));
    const hallado = r.find(Boolean);
    if (hallado) { location.replace(encodeURI(hallado)); return; }
  }
  document.getElementById('m').textContent = 'Plano no encontrado. AGROFSIG - Tel. 4902 8746 / 3254 9194';
})();
</script></body></html>
